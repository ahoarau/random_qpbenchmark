[workspace]
name = "random_qpbenchmark"
version = "0.1.0"
description = "A benchmark of randomly generated dense strongly convex QPs."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
pyarrow = "*"
clarabel = "*"
cvxopt = "*"
daqp = "*"
ecos = "*"
git-lfs = "*"
highspy = "*"
osqp = "*"
pandas = "*"
piqp = "*"
proxsuite = "*"
pytest = "*"
pytest-benchmark = "*"
qpbenchmark = "*"
qpoases = "*"
qpsolvers = "*"
quadprog = "*"
scs = "*"

[pypi-dependencies]
qpalm = "*"
pyqpmad = ">=1.4.1"

[tasks]
generate_scenarios = "python generate/generate_scenarios.py"
random_qpbenchmark = "python random_qpbenchmark.py"
